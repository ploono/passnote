<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 300" width="1040" height="300" role="img" aria-label="When passnote post rings a doorbell. Only a post to members by name that is an ask or err, uses --wake or --urgent, or replies to their ask or prop can wake them; anything else waits for their next turn at no extra cost. A post that may be held from them prints WAIT held. After 3 wakes from you to them in 10 minutes it prints WAIT breaker, even with --urgent. A gone session prints WAIT gone and sees the post when resumed. With --urgent or a warm prompt cache it prints WAKE and a SendMessage line; otherwise WAIT cold, and the post waits for their next turn.">
<title>When post wakes a session</title>
<style>
.t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px;fill:#1b1714}
.b{font-weight:600}.s{font-size:11.5px}.g{fill:#6e6862}.r{fill:#3d5bd9}.m{fill:#e8344e}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.box{fill:#fffdf8;stroke:#b9b0a0;stroke-width:1.2}
.dec{fill:#fffdf8;stroke:#b9b0a0;stroke-width:1.2;stroke-dasharray:5 4}
.ok{fill:#e3e8fa;stroke:#3d5bd9;stroke-width:1.2}
.hot{fill:#fbe0e4;stroke:#e8344e;stroke-width:1.2}
.ln{stroke:#1b1714;stroke-width:1.4;fill:none}
.lr{stroke:#3d5bd9;stroke-width:1.8;fill:none}
</style>
<defs>
<marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b1714"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d5bd9"/></marker>
</defs>
<rect width="1040" height="300" rx="14" fill="#f5f1e8"/>
<rect class="box" x="12" y="108" width="92" height="80" rx="10"/>
<text class="t b" x="58.0" y="144.0" text-anchor="middle">passnote</text>
<text class="t b" x="58.0" y="161.0" text-anchor="middle">post</text>
<path class="ln" d="M104,148.0 L130,148.0" marker-end="url(#ai)"/>
<rect class="dec" x="132" y="108" width="190" height="80" rx="10"/>
<text class="t b" x="227.0" y="127.0" text-anchor="middle">To them by name, and</text>
<text class="t " x="227.0" y="144.0" text-anchor="middle">ask · err · --wake/--urgent,</text>
<text class="t " x="227.0" y="161.0" text-anchor="middle">or a reply to their</text>
<text class="t " x="227.0" y="178.0" text-anchor="middle">ask or prop?</text>
<path class="ln" d="M322,148.0 L348,148.0" marker-end="url(#ai)"/>
<text class="t s g" x="336" y="140.0" text-anchor="middle">yes</text>
<path class="ln" d="M227.0,188 L227.0,218" marker-end="url(#ai)"/>
<text class="t s g" x="235.0" y="210" text-anchor="start">no</text>
<rect class="ok" x="132" y="220" width="190" height="56" rx="10"/>
<text class="t b" x="227.0" y="244.0" text-anchor="middle">Waits for their next turn</text>
<text class="t s r" x="227.0" y="261.0" text-anchor="middle">0 extra tokens</text>
<rect class="dec" x="350" y="108" width="124" height="80" rx="10"/>
<text class="t b" x="412.0" y="144.0" text-anchor="middle">May the post be</text>
<text class="t b" x="412.0" y="161.0" text-anchor="middle">held from them?</text>
<path class="ln" d="M474,148.0 L500,148.0" marker-end="url(#ai)"/>
<text class="t s g" x="488" y="140.0" text-anchor="middle">no</text>
<path class="ln" d="M412.0,188 L412.0,218" marker-end="url(#ai)"/>
<text class="t s g" x="420.0" y="210" text-anchor="start">yes</text>
<rect class="box" x="350" y="220" width="124" height="56" rx="10"/>
<text class="t b mono" x="412.0" y="244.0" text-anchor="middle">WAIT held</text>
<text class="t s g" x="412.0" y="261.0" text-anchor="middle">no doorbell</text>
<rect class="dec" x="502" y="108" width="124" height="80" rx="10"/>
<text class="t b" x="564.0" y="144.0" text-anchor="middle">3 wakes from you</text>
<text class="t b" x="564.0" y="161.0" text-anchor="middle">to them in 10 min?</text>
<path class="ln" d="M626,148.0 L652,148.0" marker-end="url(#ai)"/>
<text class="t s g" x="640" y="140.0" text-anchor="middle">no</text>
<path class="ln" d="M564.0,188 L564.0,218" marker-end="url(#ai)"/>
<text class="t s g" x="572.0" y="210" text-anchor="start">yes</text>
<rect class="box" x="502" y="220" width="124" height="56" rx="10"/>
<text class="t b mono" x="564.0" y="244.0" text-anchor="middle">WAIT breaker</text>
<text class="t s g" x="564.0" y="261.0" text-anchor="middle">even --urgent</text>
<rect class="dec" x="654" y="108" width="104" height="80" rx="10"/>
<text class="t b" x="706.0" y="144.0" text-anchor="middle">Session</text>
<text class="t b" x="706.0" y="161.0" text-anchor="middle">gone?</text>
<path class="ln" d="M758,148.0 L784,148.0" marker-end="url(#ai)"/>
<text class="t s g" x="772" y="140.0" text-anchor="middle">no</text>
<path class="ln" d="M706.0,188 L706.0,218" marker-end="url(#ai)"/>
<text class="t s g" x="714.0" y="210" text-anchor="start">yes</text>
<rect class="box" x="654" y="220" width="104" height="56" rx="10"/>
<text class="t b mono" x="706.0" y="244.0" text-anchor="middle">WAIT gone</text>
<text class="t s g" x="706.0" y="261.0" text-anchor="middle">seen on resume</text>
<rect class="dec" x="786" y="108" width="100" height="80" rx="10"/>
<text class="t mono" x="836.0" y="144.0" text-anchor="middle">--urgent</text>
<text class="t b" x="836.0" y="161.0" text-anchor="middle">or warm?</text>
<rect class="hot" x="920" y="20" width="104" height="72" rx="10"/>
<text class="t b m mono" x="972.0" y="43.5" text-anchor="middle">WAKE</text>
<text class="t s" x="972.0" y="60.5" text-anchor="middle">SendMessage</text>
<text class="t s" x="972.0" y="77.5" text-anchor="middle">doorbell</text>
<rect class="ok" x="920" y="208" width="104" height="72" rx="10"/>
<text class="t b r mono" x="972.0" y="231.5" text-anchor="middle">WAIT</text>
<text class="t s" x="972.0" y="248.5" text-anchor="middle">cold: their</text>
<text class="t s" x="972.0" y="265.5" text-anchor="middle">next turn</text>
<path class="ln" d="M836.0,108 C836.0,70 890,56 918,56" marker-end="url(#ai)"/>
<text class="t s g" x="828.0" y="98" text-anchor="end">yes</text>
<path class="ln" d="M836.0,188 C836.0,230 890,244 918,244" marker-end="url(#ai)"/>
<text class="t s g" x="828.0" y="206" text-anchor="end">no</text>
<text class="t s g" x="12" y="36" text-anchor="start">A broadcast never wakes anyone.</text>
<text class="t s g" x="12" y="54" text-anchor="start">A warm wake reads ~98% of its context from cache.</text>
</svg>
