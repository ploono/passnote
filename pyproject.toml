# Tool settings only. passnote is a Claude Code plugin, not a Python package: there is nothing to
# build or install from here.

[tool.ruff]
target-version = "py39"
# The entrypoint has no .py suffix.
extend-include = ["plugin/bin/passnote"]

[tool.ruff.lint]
# Named, not ruff's default set (which grows between releases): pyflakes and the syntax-level
# pycodestyle checks, plus I002, since the plugin's modules must keep Python 3.9 working.
select = ["E4", "E7", "E9", "F", "I002"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.per-file-ignores]
# The required import is for the plugin's code; the tests run on the developer's Python.
"tests/**" = ["I002"]
# The entrypoint itself must run far enough on an old python3 to stay silent in hook mode.
"plugin/bin/passnote" = ["I002"]
