name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One group per PR (by number) or per ref, so a fork's PR from its own `main` never shares a group
# with this repository's main. A newer PR run cancels the older one. On main nothing is cancelled
# mid-run, but a newer run replaces an older one that is still waiting to start.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Python 3.9's unittest exits 0 when it finds no tests: fail if fewer than this ran.
  MIN_TESTS: 395

# Actions are pinned by commit; Dependabot (.github/dependabot.yml) updates the pins and comments.
jobs:
  unit:
    name: unit (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.9 is pinned to 24.04: the newest Ubuntu images may stop offering an EOL Python.
          - {os: ubuntu-24.04, python: "3.9", flags: ""}
          - {os: ubuntu-latest, python: "3.x", flags: "-X dev -W error"}
          - {os: macos-latest, python: "3.x", flags: "-X dev -W error"}
          # The interpreter most macOS users have: Apple's /usr/bin/python3 (3.9).
          - {os: macos-latest, python: "system", flags: ""}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: matrix.python != 'system'
        with:
          python-version: ${{ matrix.python }}
      - name: run the unit tests
        shell: bash
        env:
          PY: ${{ matrix.python == 'system' && '/usr/bin/python3' || 'python' }}
        run: |
          "$PY" --version
          "$PY" ${{ matrix.flags }} -m unittest discover -s tests -v 2>&1 | tee unittest.log
          ran=$(sed -n 's/^Ran \([0-9][0-9]*\) tests\{0,1\} in .*/\1/p' unittest.log)
          if [ "${ran:-0}" -lt "$MIN_TESTS" ]; then
            echo "::error::only ${ran:-0} tests ran; expected at least $MIN_TESTS"
            exit 1
          fi

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck --version
      - run: shellcheck -s sh plugin/hooks/guard.sh

  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned: a new ruff release can add findings; bump it on purpose.
      - run: pipx run ruff==0.16.10 check
